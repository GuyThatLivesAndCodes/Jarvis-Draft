[package]
name = "jarvis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
eframe      = { version = "0.28", features = ["default"] }
egui        = "0.28"
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
reqwest     = { version = "0.12", features = ["json"] }
chrono      = { version = "0.4",  features = ["clock"] }
dirs        = "5"
log         = "0.4"
env_logger  = "0.11"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
