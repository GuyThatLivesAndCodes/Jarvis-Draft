<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 0%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 0% 100%, rgba(30,100,180,0.18) 0%, transparent 50%);
    pointer-events: none; z-index: 20;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    box-shadow: inset 0 0 80px 10px rgba(40,120,200,0.12);
    pointer-events: none; z-index: 20;
  }

  /* ── SPLASH ── */
  #splash {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: absolute; inset: 0; z-index: 5;
    transition: opacity 0.5s ease;
  }
  #splash.hiding { opacity: 0; pointer-events: none; }

  .blob-wrapper {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 260px; height: 260px;
    cursor: pointer;
  }

  .blob {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%;
    background: radial-gradient(ellipse at 40% 35%,
      rgba(90,160,220,0.55) 0%,
      rgba(50,120,185,0.45) 40%,
      rgba(20,70,130,0.3) 70%,
      transparent 100%
    );
    box-shadow:
      0 0 60px 20px rgba(60,140,210,0.2),
      0 0 120px 40px rgba(30,90,160,0.1),
      inset 0 0 30px rgba(150,200,255,0.1);
    animation: blobMorph 8s ease-in-out infinite;
    filter: blur(1px);
    transition: transform 0.15s ease;
  }
  .blob-wrapper:hover .blob { transform: scale(1.04); }
  .blob-wrapper:active .blob { transform: scale(0.97); }

  .blob-text {
    position: relative; z-index: 2;
    font-size: 2.4rem; font-weight: 700;
    letter-spacing: 0.18em;
    color: rgba(200,230,255,0.92);
    text-shadow:
      0 0 20px rgba(100,180,255,0.8),
      0 0 40px rgba(60,140,220,0.5),
      0 0 80px rgba(40,100,180,0.3);
    user-select: none; pointer-events: none;
  }

  @keyframes blobMorph {
    0%   { border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%; }
    25%  { border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
    50%  { border-radius: 55% 45% 60% 40% / 45% 60% 40% 55%; }
    75%  { border-radius: 40% 60% 45% 55% / 60% 40% 55% 45%; }
    100% { border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%; }
  }

  .time {
    margin-top: 36px;
    font-size: 1.1rem; font-weight: 400;
    letter-spacing: 0.25em;
    color: rgba(130,180,230,0.55);
    z-index: 2;
    text-shadow: 0 0 12px rgba(80,150,220,0.3);
  }

  /* ── CANVASES ── */
  #particleCanvas {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    transition: opacity 0.5s ease;
  }
  #particleCanvas.hidden { opacity: 0; }

  #gridCanvas {
    position: fixed; inset: 0; z-index: 3;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease 0.25s;
  }
  #gridCanvas.visible { opacity: 1; }

  /* ── CANVAS PAGE ── */
  #canvas-page {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease 0.35s;
  }
  #canvas-page.visible { opacity: 1; }

  .jarvis-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 40% 35%,
      rgba(90,160,220,0.6) 0%,
      rgba(50,120,185,0.5) 50%,
      rgba(20,70,130,0.35) 100%
    );
    box-shadow:
      0 0 30px 8px rgba(60,140,210,0.25),
      0 0 60px 16px rgba(30,90,160,0.12);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transform: scale(7);
    opacity: 0;
    transition:
      transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.5s ease;
  }
  .jarvis-circle.entered {
    transform: scale(1);
    opacity: 1;
  }

  .jarvis-circle-text {
    font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.2em;
    color: rgba(200,230,255,0.9);
    text-shadow: 0 0 10px rgba(100,180,255,0.7);
    user-select: none;
  }

  /* ── DASHBOARD ── */
  #dashboard {
    position: absolute;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(10,25,45,0.92) 0%, rgba(18,35,60,0.88) 100%);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: 0 0 24px rgba(30,80,150,0.15), inset 0 1px 0 rgba(80,140,220,0.08);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.5s ease 0.8s;
    z-index: 6;
    width: min(560px, 90vw);
  }
  #dashboard.visible { opacity: 1; }

  .dash-btn {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 6px;
    background: rgba(30,65,110,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .dash-btn:hover {
    background: rgba(45,90,150,0.6);
    border-color: rgba(80,150,220,0.4);
  }

  .dash-btn-group {
    display: flex; gap: 6px;
  }

  #askInput {
    flex: 1;
    height: 36px;
    background: rgba(8,20,40,0.7);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 6px;
    color: rgba(180,220,255,0.85);
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    padding: 0 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #askInput::placeholder { color: rgba(100,160,220,0.4); }
  #askInput:focus {
    border-color: rgba(80,150,220,0.55);
    box-shadow: 0 0 12px rgba(60,130,210,0.15);
  }

  /* ── SETTINGS PANEL ── */
  #settingsPanel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 400px;
    height: 100vh;
    background: linear-gradient(135deg, rgba(10,25,45,0.98) 0%, rgba(18,35,60,0.95) 100%);
    border-left: 1px solid rgba(50,100,160,0.3);
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    z-index: 100;
    transition: right 0.3s ease;
    overflow-y: auto;
    padding: 20px;
  }

  #settingsPanel.visible {
    right: 0;
  }

  .settings-header {
    font-size: 1.2rem;
    color: rgba(200,230,255,0.92);
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(100,180,255,0.5);
  }

  .settings-group {
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(50,100,160,0.2);
    padding-bottom: 15px;
  }

  .settings-label {
    font-size: 0.8rem;
    color: rgba(130,180,230,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    display: block;
  }

  .settings-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(8,20,40,0.7);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 4px;
    color: rgba(180,220,255,0.85);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
  }

  .settings-input:focus {
    border-color: rgba(80,150,220,0.55);
    box-shadow: 0 0 8px rgba(60,130,210,0.15);
    outline: none;
  }

  .settings-btn {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: rgba(50,120,180,0.6);
    border: 1px solid rgba(80,150,220,0.4);
    border-radius: 4px;
    color: rgba(200,230,255,0.9);
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: background 0.2s;
  }

  .settings-btn:hover {
    background: rgba(70,140,200,0.7);
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 30px;
    height: 30px;
    background: rgba(50,100,160,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    border-radius: 4px;
    color: rgba(200,230,255,0.8);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .close-btn:hover {
    background: rgba(70,140,200,0.6);
  }

  .status-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }

  .status-online {
    background: rgba(76, 175, 80, 0.8);
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
  }

  .status-offline {
    background: rgba(244, 67, 54, 0.8);
    box-shadow: 0 0 8px rgba(244, 67, 54, 0.3);
  }

  .notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, rgba(50,120,180,0.9) 0%, rgba(35,90,150,0.9) 100%);
    border: 1px solid rgba(100,180,255,0.5);
    border-radius: 8px;
    padding: 15px 20px;
    color: rgba(200,230,255,0.95);
    font-size: 0.8rem;
    box-shadow: 0 0 20px rgba(60,140,210,0.3);
    max-width: 300px;
    z-index: 50;
    animation: slideIn 0.3s ease, slideOut 0.3s ease 4.7s;
  }

  @keyframes slideIn {
    from {
      right: -350px;
      opacity: 0;
    }
    to {
      right: 20px;
      opacity: 1;
    }
  }

  @keyframes slideOut {
    from {
      right: 20px;
      opacity: 1;
    }
    to {
      right: -350px;
      opacity: 0;
    }
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<canvas id="gridCanvas"></canvas>

<div id="splash">
  <div class="blob-wrapper" id="blobBtn">
    <div class="blob"></div>
    <span class="blob-text">JARVIS</span>
  </div>
  <div class="time" id="clock">00:00</div>
</div>

<div id="canvas-page">
  <div class="jarvis-circle" id="jarvisCircle">
    <span class="jarvis-circle-text">JARVIS</span>
  </div>
</div>

<div id="dashboard">
  <div class="dash-btn-group">
    <button class="dash-btn" id="settingsBtn" title="Settings"></button>
    <button class="dash-btn" id="adminBtn" title="Admin"></button>
  </div>
  <input id="askInput" type="text" placeholder="Ask Jarvis..." spellcheck="false" autocomplete="off" />
  <div class="dash-btn-group">
    <button class="dash-btn" id="micBtn" title="Microphone"></button>
    <button class="dash-btn" id="moreBtn" title="More"></button>
  </div>
</div>

<div id="settingsPanel">
  <button class="close-btn" id="closeSettings">&times;</button>
  <div class="settings-header">Settings</div>

  <div class="settings-group">
    <label class="settings-label">Local LLMs</label>
    <div style="margin-bottom: 10px;">
      <span class="status-indicator" id="ollamaStatus"></span>
      <span id="ollamaText">Ollama: Checking...</span>
    </div>
    <div>
      <span class="status-indicator" id="lmstudioStatus"></span>
      <span id="lmstudioText">LM Studio: Checking...</span>
    </div>
  </div>

  <div class="settings-group">
    <label class="settings-label">Anthropic API Key</label>
    <input type="password" class="settings-input" id="anthropicKey" placeholder="sk-ant-...">
    <button class="settings-btn" id="testAnthropicBtn">Test Connection</button>
  </div>

  <div class="settings-group">
    <label class="settings-label">OpenAI API Key</label>
    <input type="password" class="settings-input" id="openaiKey" placeholder="sk-...">
    <button class="settings-btn" id="testOpenaiBtn">Test Connection</button>
  </div>

  <div class="settings-group">
    <label class="settings-label">xAI API Key</label>
    <input type="password" class="settings-input" id="xaiKey" placeholder="xai-...">
    <button class="settings-btn" id="testXaiBtn">Test Connection</button>
  </div>

  <div class="settings-group">
    <label class="settings-label">Admin Mode</label>
    <input type="password" class="settings-input" id="adminPassword" placeholder="Set Admin Password">
    <button class="settings-btn" id="enableAdminBtn">Enable Admin Mode</button>
  </div>

  <div class="settings-group">
    <label style="display: flex; align-items: center; gap: 8px; color: rgba(130,180,230,0.7);">
      <input type="checkbox" id="autoSwitchLocal" style="width: 16px; height: 16px;">
      <span>Auto-switch to Local LLM when available</span>
    </label>
  </div>

  <button class="settings-btn" id="saveSettingsBtn" style="margin-top: 20px;">Save Settings</button>
</div>

<script type="module">
import { invoke } from '@tauri-apps/api/tauri';
import { listen } from '@tauri-apps/api/event';

// Clock
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
tick();
setInterval(tick, 1000);

// Particles
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let pActive = true;

function resizeP() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeP();
window.addEventListener('resize', resizeP);

const CX = () => pCanvas.width / 2;
const CY = () => pCanvas.height / 2;

function mkP() {
  const a = Math.random() * Math.PI * 2;
  const r = 90 + Math.random() * 90;
  return {
    x: CX() + Math.cos(a) * r,
    y: CY() + Math.sin(a) * r,
    vx: (Math.random() - 0.5) * 0.12,
    vy: (Math.random() - 0.5) * 0.12,
    size: 0.8 + Math.random() * 1.8,
    alpha: Math.random(),
    dir: Math.random() < 0.5 ? 1 : -1,
    spd: 0.0015 + Math.random() * 0.003
  };
}

const particles = Array.from({ length: 55 }, mkP);

(function drawP() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  if (pActive) {
    for (const p of particles) {
      p.alpha += p.dir * p.spd;
      if (p.alpha >= 1) {
        p.alpha = 1;
        p.dir = -1;
      }
      if (p.alpha <= 0) {
        const a = Math.random() * Math.PI * 2;
        const r = 90 + Math.random() * 90;
        p.x = CX() + Math.cos(a) * r;
        p.y = CY() + Math.sin(a) * r;
        p.vx = (Math.random() - 0.5) * 0.12;
        p.vy = (Math.random() - 0.5) * 0.12;
        p.alpha = 0;
        p.dir = 1;
      }
      p.x += p.vx;
      p.y += p.vy;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(100,170,230,${p.alpha * 0.75})`;
      pCtx.fill();
    }
  }
  requestAnimationFrame(drawP);
})();

// Grid
const gCanvas = document.getElementById('gridCanvas');
const gCtx = gCanvas.getContext('2d');

function drawGrid() {
  gCanvas.width = window.innerWidth;
  gCanvas.height = window.innerHeight;
  const W = gCanvas.width;
  const H = gCanvas.height;
  const step = 44;
  gCtx.strokeStyle = 'rgba(35,75,115,0.38)';
  gCtx.lineWidth = 0.5;
  for (let x = 0; x <= W; x += step) {
    gCtx.beginPath();
    gCtx.moveTo(x, 0);
    gCtx.lineTo(x, H);
    gCtx.stroke();
  }
  for (let y = 0; y <= H; y += step) {
    gCtx.beginPath();
    gCtx.moveTo(0, y);
    gCtx.lineTo(W, y);
    gCtx.stroke();
  }
}
drawGrid();
window.addEventListener('resize', drawGrid);

// Activation
function activate() {
  const splash = document.getElementById('splash');
  const page = document.getElementById('canvas-page');
  const grid = document.getElementById('gridCanvas');
  const circle = document.getElementById('jarvisCircle');

  splash.classList.add('hiding');
  pCanvas.classList.add('hidden');
  pActive = false;

  setTimeout(() => grid.classList.add('visible'), 150);

  setTimeout(() => {
    page.style.display = 'flex';
    requestAnimationFrame(() => {
      page.classList.add('visible');
      setTimeout(() => circle.classList.add('entered'), 40);
    });
  }, 350);

  setTimeout(() => document.getElementById('dashboard').classList.add('visible'), 500);
}

document.getElementById('blobBtn').addEventListener('click', activate);

// Fullscreen on F11
window.addEventListener('keydown', (e) => {
  if (e.key === 'F11') {
    e.preventDefault();
    invoke('toggle_fullscreen');
  }
});

// Settings Panel
const settingsPanel = document.getElementById('settingsPanel');
const settingsBtn = document.getElementById('settingsBtn');
const closeSettings = document.getElementById('closeSettings');

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.add('visible');
  checkLLMStatus();
});

closeSettings.addEventListener('click', () => {
  settingsPanel.classList.remove('visible');
});

// Check LLM Status
async function checkLLMStatus() {
  try {
    const status = await invoke('get_available_llms');
    updateLLMStatus(status);
  } catch (err) {
    console.error('Failed to check LLM status:', err);
  }
}

function updateLLMStatus(status) {
  const ollamaEl = document.getElementById('ollamaStatus');
  const ollamaText = document.getElementById('ollamaText');
  const lmstudioEl = document.getElementById('lmstudioStatus');
  const lmstudioText = document.getElementById('lmstudioText');

  if (status.ollama_available) {
    ollamaEl.classList.remove('status-offline');
    ollamaEl.classList.add('status-online');
    ollamaText.textContent = `Ollama: Online (${status.ollama_models.length} models)`;
  } else {
    ollamaEl.classList.remove('status-online');
    ollamaEl.classList.add('status-offline');
    ollamaText.textContent = 'Ollama: Offline';
  }

  if (status.lm_studio_available) {
    lmstudioEl.classList.remove('status-offline');
    lmstudioEl.classList.add('status-online');
    lmstudioText.textContent = `LM Studio: Online (${status.lm_studio_models.length} models)`;
  } else {
    lmstudioEl.classList.remove('status-online');
    lmstudioEl.classList.add('status-offline');
    lmstudioText.textContent = 'LM Studio: Offline';
  }
}

// Load Settings
async function loadSettings() {
  try {
    const settings = await invoke('get_settings');
    const anthropicKey = settings.api_credentials.find(c => c.provider === 'anthropic');
    const openaiKey = settings.api_credentials.find(c => c.provider === 'openai');
    const xaiKey = settings.api_credentials.find(c => c.provider === 'xai');

    if (anthropicKey) document.getElementById('anthropicKey').value = anthropicKey.api_key;
    if (openaiKey) document.getElementById('openaiKey').value = openaiKey.api_key;
    if (xaiKey) document.getElementById('xaiKey').value = xaiKey.api_key;

    document.getElementById('autoSwitchLocal').checked = settings.auto_switch_to_local;
  } catch (err) {
    console.error('Failed to load settings:', err);
  }
}

loadSettings();

// Save Settings
document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
  try {
    const currentSettings = await invoke('get_settings');

    currentSettings.api_credentials = [];
    if (document.getElementById('anthropicKey').value) {
      currentSettings.api_credentials.push({
        provider: 'anthropic',
        api_key: document.getElementById('anthropicKey').value,
        enabled: true
      });
    }
    if (document.getElementById('openaiKey').value) {
      currentSettings.api_credentials.push({
        provider: 'openai',
        api_key: document.getElementById('openaiKey').value,
        enabled: true
      });
    }
    if (document.getElementById('xaiKey').value) {
      currentSettings.api_credentials.push({
        provider: 'xai',
        api_key: document.getElementById('xaiKey').value,
        enabled: true
      });
    }

    currentSettings.auto_switch_to_local = document.getElementById('autoSwitchLocal').checked;

    await invoke('update_settings', { newSettings: currentSettings });
    showNotification('Settings saved successfully!');
  } catch (err) {
    console.error('Failed to save settings:', err);
    showNotification('Error saving settings');
  }
});

// Test Connections
document.getElementById('testAnthropicBtn').addEventListener('click', async () => {
  const key = document.getElementById('anthropicKey').value;
  if (!key) {
    showNotification('Please enter an API key');
    return;
  }
  try {
    const success = await invoke('test_anthropic', { apiKey: key });
    showNotification(success ? 'Anthropic connection successful!' : 'Anthropic connection failed');
  } catch (err) {
    showNotification('Error testing Anthropic connection');
  }
});

document.getElementById('testOpenaiBtn').addEventListener('click', async () => {
  const key = document.getElementById('openaiKey').value;
  if (!key) {
    showNotification('Please enter an API key');
    return;
  }
  try {
    const success = await invoke('test_openai', { apiKey: key });
    showNotification(success ? 'OpenAI connection successful!' : 'OpenAI connection failed');
  } catch (err) {
    showNotification('Error testing OpenAI connection');
  }
});

document.getElementById('testXaiBtn').addEventListener('click', async () => {
  const key = document.getElementById('xaiKey').value;
  if (!key) {
    showNotification('Please enter an API key');
    return;
  }
  try {
    const success = await invoke('test_xai', { apiKey: key });
    showNotification(success ? 'xAI connection successful!' : 'xAI connection failed');
  } catch (err) {
    showNotification('Error testing xAI connection');
  }
});

// LLM Status Listener
listen('llm_status', (event) => {
  console.log('LLM Status Updated:', event.payload);
  updateLLMStatus(event.payload);

  const settings = invoke('get_settings');
  if (event.payload.ollama_available || event.payload.lm_studio_available) {
    if (settings.notification_on_local_available) {
      const available = [];
      if (event.payload.ollama_available) available.push('Ollama');
      if (event.payload.lm_studio_available) available.push('LM Studio');
      showNotification(`Local LLM available: ${available.join(', ')}`);
    }
  }
});

// Notification
function showNotification(message) {
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.textContent = message;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 5000);
}

// Ask Input Handler
document.getElementById('askInput').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const message = e.target.value.trim();
    if (!message) return;

    e.target.value = '';
    showNotification('Processing your request...');

    try {
      const settings = await invoke('get_settings');
      let provider = 'ollama';
      let apiKey = null;

      // Prefer local LLMs if available
      const llmStatus = await invoke('get_available_llms');
      if (!llmStatus.ollama_available && !llmStatus.lm_studio_available) {
        // Fall back to cloud APIs
        if (settings.api_credentials.length > 0) {
          provider = settings.api_credentials[0].provider;
          apiKey = settings.api_credentials[0].api_key;
        } else {
          showNotification('No LLM configured. Please add API keys in settings.');
          return;
        }
      }

      const response = await invoke('query_ai', {
        query: {
          provider,
          messages: [{ role: 'user', content: message }],
          model: null
        },
        apiKey
      });

      showNotification(`${response.provider}: ${response.content.substring(0, 100)}...`);
    } catch (err) {
      console.error('Query failed:', err);
      showNotification('Query failed: ' + err);
    }
  }
});
</script>
