<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Native AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 0%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(30,100,180,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 0% 100%, rgba(30,100,180,0.18) 0%, transparent 50%);
    pointer-events: none; z-index: 20;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    box-shadow: inset 0 0 80px 10px rgba(40,120,200,0.12);
    pointer-events: none; z-index: 20;
  }

  /* ── SPLASH ── */
  #splash {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: absolute; inset: 0; z-index: 5;
    transition: opacity 0.5s ease;
  }
  #splash.hiding { opacity: 0; pointer-events: none; }

  .blob-wrapper {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 260px; height: 260px;
    cursor: pointer;
  }

  .blob {
    position: absolute;
    width: 220px; height: 220px;
    border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%;
    background: radial-gradient(ellipse at 40% 35%,
      rgba(90,160,220,0.55) 0%,
      rgba(50,120,185,0.45) 40%,
      rgba(20,70,130,0.3) 70%,
      transparent 100%
    );
    box-shadow:
      0 0 60px 20px rgba(60,140,210,0.2),
      0 0 120px 40px rgba(30,90,160,0.1),
      inset 0 0 30px rgba(150,200,255,0.1);
    animation: blobMorph 8s ease-in-out infinite;
    filter: blur(1px);
    transition: transform 0.15s ease;
  }
  .blob-wrapper:hover .blob { transform: scale(1.04); }
  .blob-wrapper:active .blob { transform: scale(0.97); }

  .blob-text {
    position: relative; z-index: 2;
    font-size: 2.4rem; font-weight: 700;
    letter-spacing: 0.18em;
    color: rgba(200,230,255,0.92);
    text-shadow:
      0 0 20px rgba(100,180,255,0.8),
      0 0 40px rgba(60,140,220,0.5),
      0 0 80px rgba(40,100,180,0.3);
    user-select: none; pointer-events: none;
  }

  @keyframes blobMorph {
    0%   { border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%; }
    25%  { border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
    50%  { border-radius: 55% 45% 60% 40% / 45% 60% 40% 55%; }
    75%  { border-radius: 40% 60% 45% 55% / 60% 40% 55% 45%; }
    100% { border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%; }
  }

  .time {
    margin-top: 36px;
    font-size: 1.1rem; font-weight: 400;
    letter-spacing: 0.25em;
    color: rgba(130,180,230,0.55);
    z-index: 2;
    text-shadow: 0 0 12px rgba(80,150,220,0.3);
  }

  /* ── CANVASES ── */
  #particleCanvas {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    transition: opacity 0.5s ease;
  }
  #particleCanvas.hidden { opacity: 0; }

  #gridCanvas {
    position: fixed; inset: 0; z-index: 3;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease 0.25s;
  }
  #gridCanvas.visible { opacity: 1; }

  /* ── CANVAS PAGE ── */
  #canvas-page {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease 0.35s;
  }
  #canvas-page.visible { opacity: 1; }

  .jarvis-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 40% 35%,
      rgba(90,160,220,0.6) 0%,
      rgba(50,120,185,0.5) 50%,
      rgba(20,70,130,0.35) 100%
    );
    box-shadow:
      0 0 30px 8px rgba(60,140,210,0.25),
      0 0 60px 16px rgba(30,90,160,0.12);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transform: scale(7);
    opacity: 0;
    transition:
      transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.5s ease;
  }
  .jarvis-circle.entered {
    transform: scale(1);
    opacity: 1;
  }
  @keyframes circleGlow {
    0%, 100% { box-shadow: 0 0 30px 8px rgba(60,140,210,0.25), 0 0 60px 16px rgba(30,90,160,0.12); }
    50%       { box-shadow: 0 0 50px 18px rgba(60,140,210,0.5), 0 0 90px 30px rgba(30,90,160,0.28); }
  }
  .jarvis-circle.thinking { animation: circleGlow 1s ease-in-out infinite; }

  .jarvis-circle-text {
    font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.2em;
    color: rgba(200,230,255,0.9);
    text-shadow: 0 0 10px rgba(100,180,255,0.7);
    user-select: none;
  }

  /* ── CHAT PANEL (DRAGGABLE) ── */
  #chatPanel {
    position: fixed;
    width: min(700px, 85vw);
    max-height: 50vh;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(8,20,42,0.92) 0%, rgba(14,30,58,0.89) 100%);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    z-index: 15;
    opacity: 0;
    transition: opacity 0.3s ease;
    bottom: 80px; left: 50%; transform: translateX(-50%);
    box-shadow: 0 0 30px rgba(30,80,180,0.2);
    resize: both;
  }
  #chatPanel.visible { opacity: 1; }
  #chatPanel.minimized { max-height: 0; padding: 0; overflow: hidden; }

  .chat-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; border-bottom: 1px solid rgba(50,100,160,0.2);
    cursor: move;
    user-select: none;
  }

  .chat-title {
    font-size: 0.52rem; letter-spacing: 0.2em;
    color: rgba(120,180,240,0.8);
  }

  .chat-controls {
    display: flex; gap: 6px;
  }

  .chat-btn {
    width: 20px; height: 20px;
    border-radius: 3px;
    background: rgba(30,70,120,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: rgba(130,190,240,0.7);
    transition: background 0.15s;
  }
  .chat-btn:hover { background: rgba(45,95,150,0.65); }

  .chat-content {
    display: flex; flex-direction: column; gap: 12px;
    flex: 1;
  }

  .chat-msg { display: flex; flex-direction: column; gap: 4px; }
  .chat-msg-role {
    font-size: 0.46rem; letter-spacing: 0.2em;
    font-family: 'Orbitron', monospace;
  }
  .chat-msg.user .chat-msg-role    { color: rgba(100,170,255,0.65); }
  .chat-msg.assistant .chat-msg-role { color: rgba(60,200,130,0.65); }
  .chat-msg-content {
    font-size: 0.75rem; line-height: 1.6;
    color: rgba(180,220,255,0.85);
    font-family: 'Courier New', monospace;
    white-space: pre-wrap; word-break: break-word;
  }

  .tool-result {
    margin-top: 6px; padding: 6px 8px;
    background: rgba(40,100,160,0.2);
    border-left: 2px solid rgba(60,150,220,0.5);
    border-radius: 3px;
    font-size: 0.7rem;
    color: rgba(150,200,255,0.8);
  }

  .chat-loading {
    display: flex; gap: 6px; align-items: center; padding: 4px 0;
  }
  .chat-loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(70,140,230,0.7);
    animation: loadPulse 1.1s ease-in-out infinite;
  }
  .chat-loading span:nth-child(2) { animation-delay: 0.18s; }
  .chat-loading span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes loadPulse {
    0%, 100% { opacity: 0.25; transform: scale(0.75); }
    50%       { opacity: 1;    transform: scale(1.1); }
  }

  /* ── DASHBOARD ── */
  #dashboard {
    position: fixed;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(10,25,45,0.92) 0%, rgba(18,35,60,0.88) 100%);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: 0 0 24px rgba(30,80,150,0.15);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.5s ease 0.8s;
    z-index: 6;
    width: min(620px, 92vw);
  }
  #dashboard.visible { opacity: 1; }

  .dash-btn {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 6px;
    background: rgba(30,65,110,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    color: rgba(130,190,240,0.75);
    font-size: 15px;
    user-select: none;
  }
  .dash-btn:hover {
    background: rgba(45,90,150,0.6);
    border-color: rgba(80,150,220,0.4);
  }

  .dash-btn-group {
    display: flex; gap: 6px; position: relative;
  }

  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(60,190,100,0.85);
    box-shadow: 0 0 6px rgba(60,190,100,0.55);
    transition: background 0.4s, box-shadow 0.4s;
  }
  .status-dot.offline {
    background: rgba(200,60,60,0.8);
    box-shadow: 0 0 6px rgba(200,60,60,0.5);
  }

  #askInput {
    flex: 1;
    height: 36px;
    background: rgba(8,20,40,0.7);
    border: 1px solid rgba(50,100,160,0.3);
    border-radius: 6px;
    color: rgba(180,220,255,0.85);
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    padding: 0 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #askInput::placeholder { color: rgba(100,160,220,0.4); }
  #askInput:focus {
    border-color: rgba(80,150,220,0.55);
    box-shadow: 0 0 12px rgba(60,130,210,0.15);
  }

  .provider-pill {
    height: 36px; padding: 0 10px;
    border-radius: 6px;
    background: rgba(30,65,110,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 0.44rem; letter-spacing: 0.1em;
    color: rgba(130,190,240,0.8);
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .provider-pill:hover {
    background: rgba(45,90,150,0.6);
    border-color: rgba(80,150,220,0.4);
  }

  .send-btn {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: rgba(25,90,190,0.38);
    border: 1px solid rgba(55,140,230,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(150,215,255,0.9);
    font-size: 13px;
    transition: background 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .send-btn:hover {
    background: rgba(35,110,210,0.5);
    box-shadow: 0 0 14px rgba(50,130,220,0.25);
  }

  /* ── PROVIDER DROPDOWN ── */
  #providerDropdown {
    position: absolute;
    bottom: calc(100% + 8px); right: 0;
    background: linear-gradient(135deg, rgba(8,20,45,0.98) 0%, rgba(14,32,62,0.96) 100%);
    border: 1px solid rgba(55,115,200,0.35);
    border-radius: 8px;
    padding: 6px 0;
    z-index: 50;
    display: none;
    min-width: 148px;
    box-shadow: 0 0 24px rgba(30,80,180,0.18);
  }
  #providerDropdown.open { display: block; }

  .provider-option {
    padding: 8px 14px;
    font-family: 'Orbitron', monospace;
    font-size: 0.48rem; letter-spacing: 0.12em;
    color: rgba(130,190,240,0.8);
    cursor: pointer;
    transition: background 0.12s;
    display: flex; align-items: center; gap: 8px;
  }
  .provider-option:hover  { background: rgba(40,90,160,0.3); }
  .provider-option.active { color: rgba(110,205,255,0.95); }

  .avail-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(80,80,80,0.5); flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .avail-dot.ok {
    background: rgba(55,200,100,0.85);
    box-shadow: 0 0 4px rgba(55,200,100,0.55);
  }

  /* ── SETTINGS MODAL ── */
  #settingsModal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,4,14,0.93);
    backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.22s ease;
  }
  #settingsModal.visible { opacity: 1; }

  .settings-box {
    width: min(520px, 92vw);
    background: linear-gradient(145deg, rgba(8,22,48,0.99) 0%, rgba(14,34,66,0.97) 100%);
    border: 1px solid rgba(55,115,200,0.35);
    border-radius: 13px;
    padding: 26px 30px 28px;
    box-shadow: 0 0 70px rgba(35,100,210,0.16);
    font-family: 'Orbitron', monospace;
    max-height: 90vh; overflow-y: auto;
  }

  .settings-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(45,95,160,0.22);
  }
  .settings-title {
    font-size: 0.82rem; font-weight: 700; letter-spacing: 0.26em;
    color: rgba(145,210,255,0.92);
    text-shadow: 0 0 18px rgba(75,155,255,0.38);
  }
  .settings-close {
    width: 26px; height: 26px; border-radius: 4px;
    background: rgba(30,65,110,0.5);
    border: 1px solid rgba(60,120,190,0.25);
    cursor: pointer; color: rgba(150,200,255,0.8);
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.14s;
  }
  .settings-close:hover { background: rgba(45,90,150,0.6); }

  .settings-section { margin-bottom: 18px; }
  .settings-section-label {
    font-size: 0.46rem; letter-spacing: 0.3em;
    color: rgba(75,135,200,0.6); margin-bottom: 11px;
  }

  .settings-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 9px;
  }
  .settings-key-label {
    width: 86px; flex-shrink: 0;
    font-size: 0.5rem; letter-spacing: 0.12em;
    color: rgba(125,180,230,0.7);
  }
  .settings-input {
    flex: 1; height: 31px;
    background: rgba(6,18,38,0.75);
    border: 1px solid rgba(45,95,160,0.3);
    border-radius: 5px;
    color: rgba(180,220,255,0.85);
    font-family: 'Courier New', monospace;
    font-size: 0.68rem; padding: 0 10px;
    outline: none; transition: border-color 0.18s;
  }
  .settings-input:focus  { border-color: rgba(75,145,220,0.55); }
  .settings-input::placeholder { color: rgba(70,120,175,0.38); }

  .settings-toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid rgba(35,75,130,0.15);
  }
  .settings-toggle-label {
    font-size: 0.5rem; letter-spacing: 0.1em;
    color: rgba(125,180,230,0.72);
  }
  .toggle {
    width: 36px; height: 18px; border-radius: 9px;
    background: rgba(28,62,108,0.6);
    border: 1px solid rgba(55,115,190,0.28);
    cursor: pointer; position: relative;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .toggle.on {
    background: rgba(35,115,215,0.52);
    border-color: rgba(75,160,245,0.5);
  }
  .toggle::after {
    content: '';
    position: absolute;
    width: 13px; height: 13px; border-radius: 50%;
    background: rgba(145,200,255,0.72);
    top: 2px; left: 2px;
    transition: transform 0.18s;
  }
  .toggle.on::after { transform: translateX(18px); }

  .llm-status-text {
    font-size: 0.58rem; line-height: 1.9;
    color: rgba(125,178,228,0.72);
    font-family: 'Courier New', monospace;
  }

  .settings-save {
    width: 100%; height: 38px; margin-top: 18px;
    border-radius: 7px;
    background: rgba(28,88,182,0.33);
    border: 1px solid rgba(55,138,225,0.4);
    color: rgba(148,212,255,0.92);
    font-family: 'Orbitron', monospace;
    font-size: 0.58rem; letter-spacing: 0.2em;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s;
  }
  .settings-save:hover {
    background: rgba(38,108,202,0.46);
    box-shadow: 0 0 22px rgba(45,125,215,0.22);
  }


  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 78px; right: 22px;
    background: linear-gradient(135deg, rgba(8,22,48,0.96) 0%, rgba(14,34,64,0.94) 100%);
    border: 1px solid rgba(55,130,215,0.4);
    border-radius: 8px; padding: 11px 15px;
    font-family: 'Orbitron', monospace;
    font-size: 0.52rem; letter-spacing: 0.1em;
    color: rgba(148,212,255,0.92);
    z-index: 60;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.26s, transform 0.26s;
    pointer-events: none; max-width: 270px;
    white-space: pre-line;
    box-shadow: 0 0 24px rgba(35,100,210,0.14);
  }
  #toast.visible { opacity: 1; transform: translateY(0); }

  /* ── LOCK BUTTON ── */
  .lock-dashboard-btn {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: rgba(180,60,60,0.35);
    border: 1px solid rgba(200,80,80,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(220,120,120,0.8);
    font-size: 16px;
    transition: background 0.15s;
  }
  .lock-dashboard-btn:hover {
    background: rgba(200,80,80,0.5);
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<canvas id="gridCanvas"></canvas>

<!-- SPLASH -->
<div id="splash">
  <div class="blob-wrapper" id="blobBtn">
    <div class="blob"></div>
    <span class="blob-text">JARVIS</span>
  </div>
  <div class="time" id="clock">00:00</div>
</div>

<!-- CANVAS PAGE -->
<div id="canvas-page">
  <div class="jarvis-circle" id="jarvisCircle">
    <span class="jarvis-circle-text">JARVIS</span>
  </div>
</div>

<!-- CHAT PANEL (DRAGGABLE) -->
<div id="chatPanel">
  <div class="chat-header">
    <span class="chat-title">CONVERSATION</span>
    <div class="chat-controls">
      <div class="chat-btn" id="chatMinBtn" title="Minimize">−</div>
      <div class="chat-btn" id="chatClearBtn" title="Clear">🗑</div>
      <div class="chat-btn" id="chatCloseBtn" title="Close">✕</div>
    </div>
  </div>
  <div class="chat-content" id="chatContent"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-btn-group">
    <div class="dash-btn" id="settingsBtn" title="Settings">⚙</div>
    <div class="dash-btn" id="statusBtn" title="LLM Status">
      <div class="status-dot unknown" id="statusDot"></div>
    </div>
  </div>

  <input id="askInput" type="text" placeholder="Ask Jarvis..." spellcheck="false" autocomplete="off" />

  <div class="dash-btn-group">
    <div class="provider-pill" id="providerBtn">
      <span id="providerLabel">AUTO</span><span style="opacity:0.6">▾</span>
    </div>
    <div class="send-btn" id="sendBtn" title="Send">▶</div>
    <div class="lock-dashboard-btn" id="lockBtn" title="Lock">🔓</div>
    <div id="providerDropdown">
      <div class="provider-option active" data-provider="auto" data-label="AUTO">
        <div class="avail-dot ok" id="avail-auto"></div>AUTO
      </div>
      <div class="provider-option" data-provider="anthropic" data-label="CLAUDE">
        <div class="avail-dot" id="avail-anthropic"></div>CLAUDE
      </div>
      <div class="provider-option" data-provider="openai" data-label="OPENAI">
        <div class="avail-dot" id="avail-openai"></div>OPENAI
      </div>
      <div class="provider-option" data-provider="xai" data-label="GROK">
        <div class="avail-dot" id="avail-xai"></div>GROK
      </div>
      <div class="provider-option" data-provider="ollama" data-label="OLLAMA">
        <div class="avail-dot" id="avail-ollama"></div>OLLAMA
      </div>
      <div class="provider-option" data-provider="lm_studio" data-label="LM STUDIO">
        <div class="avail-dot" id="avail-lm_studio"></div>LM STUDIO
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal">
  <div class="settings-box">
    <div class="settings-header">
      <span class="settings-title">SETTINGS</span>
      <div class="settings-close" id="settingsClose">✕</div>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">API KEYS</div>
      <div class="settings-row">
        <span class="settings-key-label">ANTHROPIC</span>
        <input class="settings-input" id="keyAnthropic" type="password" placeholder="sk-ant-..." />
      </div>
      <div class="settings-row">
        <span class="settings-key-label">OPENAI</span>
        <input class="settings-input" id="keyOpenAI" type="password" placeholder="sk-..." />
      </div>
      <div class="settings-row">
        <span class="settings-key-label">XAI / GROK</span>
        <input class="settings-input" id="keyXAI" type="password" placeholder="xai-..." />
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">LOCAL LLMs</div>
      <div class="settings-toggle-row">
        <span class="settings-toggle-label">AUTO-SWITCH TO LOCAL WHEN AVAILABLE</span>
        <div class="toggle" id="toggleAutoSwitch"></div>
      </div>
      <div class="settings-toggle-row">
        <span class="settings-toggle-label">NOTIFY WHEN LOCAL LLM COMES ONLINE</span>
        <div class="toggle" id="toggleNotify"></div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-label">LOCAL LLM STATUS</div>
      <div class="llm-status-text" id="llmStatusDisplay">Checking...</div>
    </div>


    <button class="settings-save" id="settingsSave">SAVE SETTINGS</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// Clock
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

// Particles
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let pActive = true;

function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
resizeP();
window.addEventListener('resize', resizeP);

const CX = () => pCanvas.width / 2;
const CY = () => pCanvas.height / 2;
const particles = Array.from({length: 55}, mkP);

function mkP() {
  const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 90;
  return {
    x: CX() + Math.cos(a)*r, y: CY() + Math.sin(a)*r,
    vx: (Math.random()-.5)*.12, vy: (Math.random()-.5)*.12,
    size: .8 + Math.random()*1.8,
    alpha: Math.random(), dir: Math.random()<.5?1:-1,
    spd: .0015 + Math.random()*.003
  };
}

(function drawP() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  if (pActive) for (const p of particles) {
    p.alpha += p.dir * p.spd;
    if (p.alpha >= 1) { p.alpha = 1; p.dir = -1; }
    if (p.alpha <= 0) {
      const a = Math.random()*Math.PI*2, r = 90 + Math.random()*90;
      p.x = CX() + Math.cos(a)*r; p.y = CY() + Math.sin(a)*r;
      p.vx = (Math.random()-.5)*.12; p.vy = (Math.random()-.5)*.12;
      p.alpha = 0; p.dir = 1;
    }
    p.x += p.vx; p.y += p.vy;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    pCtx.fillStyle = `rgba(100,170,230,${p.alpha*.75})`;
    pCtx.fill();
  }
  requestAnimationFrame(drawP);
})();

// Grid
const gCanvas = document.getElementById('gridCanvas');
const gCtx = gCanvas.getContext('2d');

function drawGrid() {
  gCanvas.width = window.innerWidth; gCanvas.height = window.innerHeight;
  const W = gCanvas.width, H = gCanvas.height, step = 44;
  gCtx.strokeStyle = 'rgba(35,75,115,0.38)'; gCtx.lineWidth = 0.5;
  for (let x = 0; x <= W; x += step) { gCtx.beginPath(); gCtx.moveTo(x,0); gCtx.lineTo(x,H); gCtx.stroke(); }
  for (let y = 0; y <= H; y += step) { gCtx.beginPath(); gCtx.moveTo(0,y); gCtx.lineTo(W,y); gCtx.stroke(); }
}
drawGrid();
window.addEventListener('resize', drawGrid);

// Activation
let activated = false;

function activate() {
  if (activated) return;
  activated = true;

  const splash = document.getElementById('splash');
  const page = document.getElementById('canvas-page');
  const grid = document.getElementById('gridCanvas');
  const circle = document.getElementById('jarvisCircle');

  splash.classList.add('hiding');
  pCanvas.classList.add('hidden');
  pActive = false;

  setTimeout(() => grid.classList.add('visible'), 150);
  setTimeout(() => {
    page.style.display = 'flex';
    requestAnimationFrame(() => {
      page.classList.add('visible');
      setTimeout(() => circle.classList.add('entered'), 40);
    });
  }, 350);
  setTimeout(() => document.getElementById('dashboard').classList.add('visible'), 500);
}

window.jarvisActivate = activate;
document.getElementById('blobBtn').addEventListener('click', activate);

// Fullscreen and Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'F11') {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
  if (e.key === 'Escape') {
    if (document.getElementById('settingsModal').classList.contains('visible')) closeSettings();
    if (document.getElementById('lockScreen').classList.contains('active')) return;
  }
});

let fullscreenRequested = false;
document.addEventListener('click', function tryFullscreen() {
  if (!fullscreenRequested) {
    fullscreenRequested = true;
    document.documentElement.requestFullscreen().catch(() => {});
    document.removeEventListener('click', tryFullscreen);
  }
}, { capture: true });

// State
let currentProvider = 'auto';
let chatHistory = [];
let settings = {};
let llmStatus = { ollama_available: false, lm_studio_available: false, ollama_models: [], lm_studio_models: [] };
let prevLlmStatus = null;
let settingsOpen = false;
let chatMinimized = false;

// Chat Panel Dragging
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

document.querySelector('.chat-header').addEventListener('mousedown', e => {
  isDragging = true;
  const panel = document.getElementById('chatPanel');
  const rect = panel.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
});

document.addEventListener('mousemove', e => {
  if (isDragging) {
    const panel = document.getElementById('chatPanel');
    panel.style.position = 'fixed';
    panel.style.bottom = 'auto';
    panel.style.left = (e.clientX - dragOffsetX) + 'px';
    panel.style.top = (e.clientY - dragOffsetY) + 'px';
    panel.style.transform = 'none';
  }
});

document.addEventListener('mouseup', () => { isDragging = false; });

// Chat Controls
document.getElementById('chatMinBtn').addEventListener('click', () => {
  const panel = document.getElementById('chatPanel');
  chatMinimized = !chatMinimized;
  chatMinimized ? panel.classList.add('minimized') : panel.classList.remove('minimized');
});

document.getElementById('chatClearBtn').addEventListener('click', () => {
  chatHistory = [];
  document.getElementById('chatContent').innerHTML = '';
  document.getElementById('chatPanel').style.display = 'none';
  showToast('Chat cleared');
});

document.getElementById('chatCloseBtn').addEventListener('click', () => {
  document.getElementById('chatPanel').classList.remove('visible');
  setTimeout(() => document.getElementById('chatPanel').style.display = 'none', 300);
});

// API Helpers
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// Settings
async function loadSettings() {
  try {
    settings = await apiGet('/api/settings');
    applySettingsToUI();
  } catch(e) {
    console.warn('Settings load failed:', e.message);
  }
}

function applySettingsToUI() {
  if (settings.credentials) {
    const find = p => settings.credentials.find(c => c.provider === p);
    const ant = find('anthropic'), oai = find('openai'), xai = find('xai');
    if (ant?.api_key) document.getElementById('keyAnthropic').value = ant.api_key;
    if (oai?.api_key) document.getElementById('keyOpenAI').value = oai.api_key;
    if (xai?.api_key) document.getElementById('keyXAI').value = xai.api_key;
  }
  const auto = document.getElementById('toggleAutoSwitch');
  const ntfy = document.getElementById('toggleNotify');
  settings.auto_switch_to_local ? auto.classList.add('on') : auto.classList.remove('on');
  settings.notify_on_local_available ? ntfy.classList.add('on') : ntfy.classList.remove('on');
}

async function loadLLMStatus() {
  try {
    llmStatus = await apiGet('/api/llm-status');
    updateStatusUI();
    checkLLMNotification();
  } catch(e) {
    console.warn('LLM status load failed:', e.message);
  }
}

function updateStatusUI() {
  const dot = document.getElementById('statusDot');
  const hasCloud = hasConfiguredCloud();
  const hasLocal = llmStatus.ollama_available || llmStatus.lm_studio_available;

  dot.className = 'status-dot' + (hasCloud || hasLocal ? '' : ' offline');

  const setAvail = (id, ok) => {
    document.getElementById(id).className = 'avail-dot' + (ok ? ' ok' : '');
  };
  setAvail('avail-ollama', llmStatus.ollama_available);
  setAvail('avail-lm_studio', llmStatus.lm_studio_available);
  setAvail('avail-auto', hasCloud || hasLocal);

  ['anthropic','openai','xai'].forEach(p => {
    const cred = settings.credentials?.find(c => c.provider === p);
    setAvail(`avail-${p}`, !!(cred?.enabled && cred?.api_key?.length));
  });

  const lines = [
    `Ollama:     ${llmStatus.ollama_available ? '● ONLINE' : '○ OFFLINE'}` +
      (llmStatus.ollama_models?.length ? ` — ${llmStatus.ollama_models.join(', ')}` : ''),
    `LM Studio:  ${llmStatus.lm_studio_available ? '● ONLINE' : '○ OFFLINE'}` +
      (llmStatus.lm_studio_models?.length ? ` — ${llmStatus.lm_studio_models.join(', ')}` : ''),
  ];
  document.getElementById('llmStatusDisplay').textContent = lines.join('\n');
}

function hasConfiguredCloud() {
  return !!(settings.credentials?.some(c => c.enabled && c.api_key?.length > 0 &&
    ['anthropic','openai','xai'].includes(c.provider)));
}

function checkLLMNotification() {
  if (!prevLlmStatus) { prevLlmStatus = { ...llmStatus }; return; }
  const wasLocal = prevLlmStatus.ollama_available || prevLlmStatus.lm_studio_available;
  const nowLocal = llmStatus.ollama_available || llmStatus.lm_studio_available;
  if (!wasLocal && nowLocal && settings.notify_on_local_available) {
    const who = [llmStatus.ollama_available && 'Ollama', llmStatus.lm_studio_available && 'LM Studio']
      .filter(Boolean).join(' & ');
    showToast(`Local LLM online: ${who}`);
  }
  prevLlmStatus = { ...llmStatus };
}

// Provider
function resolveProvider() {
  if (currentProvider !== 'auto') return currentProvider;
  if (settings.auto_switch_to_local) {
    if (llmStatus.ollama_available) return 'ollama';
    if (llmStatus.lm_studio_available) return 'lm_studio';
  }
  const cloud = settings.credentials?.find(c => c.enabled && c.api_key?.length > 0);
  if (cloud) return cloud.provider;
  return 'anthropic';
}

// Chat
function escHtml(t) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(t));
  return d.innerHTML;
}

function renderChat() {
  const content = document.getElementById('chatContent');
  if (!chatHistory.length) {
    document.getElementById('chatPanel').style.display = 'none';
    return;
  }
  document.getElementById('chatPanel').style.display = 'flex';
  document.getElementById('chatPanel').classList.remove('minimized');
  chatMinimized = false;
  requestAnimationFrame(() => document.getElementById('chatPanel').classList.add('visible'));

  content.innerHTML = chatHistory.map(m => `
    <div class="chat-msg ${m.role}">
      <span class="chat-msg-role">${m.role === 'user' ? 'YOU' : 'JARVIS'}</span>
      <div class="chat-msg-content">${escHtml(m.content)}</div>
    </div>`).join('');

  content.scrollTop = content.scrollHeight;
}

function showLoading() {
  const content = document.getElementById('chatContent');
  const el = document.createElement('div');
  el.className = 'chat-loading'; el.id = 'loadingDots';
  el.innerHTML = '<span></span><span></span><span></span>';
  content.appendChild(el);
  content.scrollTop = content.scrollHeight;
}

function hideLoading() {
  document.getElementById('loadingDots')?.remove();
}

async function sendQuery(text) {
  if (!text.trim()) return;
  activate();
  chatHistory.push({ role: 'user', content: text });
  renderChat();
  showLoading();

  const circle = document.getElementById('jarvisCircle');
  circle.classList.add('thinking');

  const provider = resolveProvider();
  try {
    const resp = await apiPost('/api/query', {
      provider,
      messages: chatHistory.map(m => ({ role: m.role, content: m.content })),
    });
    hideLoading();
    circle.classList.remove('thinking');
    chatHistory.push({ role: 'assistant', content: resp.content });
    renderChat();
  } catch(e) {
    hideLoading();
    circle.classList.remove('thinking');
    chatHistory.push({ role: 'assistant', content: `⚠ Error: ${e.message}` });
    renderChat();
  }
}

// Input
const input = document.getElementById('askInput');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = input.value.trim();
    if (t) { input.value = ''; sendQuery(t); }
  }
});

document.getElementById('sendBtn').addEventListener('click', () => {
  const t = input.value.trim();
  if (t) { input.value = ''; sendQuery(t); }
});

// Provider Dropdown
const dropdown = document.getElementById('providerDropdown');

document.getElementById('providerBtn').addEventListener('click', e => {
  e.stopPropagation();
  dropdown.classList.toggle('open');
});

document.querySelectorAll('.provider-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.provider-option').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    currentProvider = opt.dataset.provider;
    document.getElementById('providerLabel').textContent = opt.dataset.label;
    dropdown.classList.remove('open');
  });
});

document.addEventListener('click', () => dropdown.classList.remove('open'));

// Settings Modal
function openSettings() {
  settingsOpen = true;
  const modal = document.getElementById('settingsModal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => modal.classList.add('visible'));
}

function closeSettings() {
  settingsOpen = false;
  const modal = document.getElementById('settingsModal');
  modal.classList.remove('visible');
  setTimeout(() => { modal.style.display = 'none'; }, 240);
}

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

document.getElementById('statusBtn').addEventListener('click', () => {
  const lines = [];
  if (llmStatus.ollama_available) lines.push('Ollama: ONLINE' + (llmStatus.ollama_models?.length ? ` (${llmStatus.ollama_models[0]})` : ''));
  if (llmStatus.lm_studio_available) lines.push('LM Studio: ONLINE');
  if (!lines.length) lines.push('No local LLMs detected');
  showToast(lines.join('\n'));
});

['toggleAutoSwitch','toggleNotify'].forEach(id => {
  document.getElementById(id).addEventListener('click', function() {
    this.classList.toggle('on');
  });
});

document.getElementById('settingsSave').addEventListener('click', async () => {
  const body = {
    anthropic_key: document.getElementById('keyAnthropic').value,
    openai_key: document.getElementById('keyOpenAI').value,
    xai_key: document.getElementById('keyXAI').value,
    auto_switch_to_local: document.getElementById('toggleAutoSwitch').classList.contains('on'),
    notify_on_local_available: document.getElementById('toggleNotify').classList.contains('on'),
  };
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    settings = await apiGet('/api/settings');
    updateStatusUI();
    closeSettings();
    showToast('Settings saved');
  } catch(e) {
    showToast(`Save failed: ${e.message}`);
  }
});

// Reset to Splash
function resetToSplash() {
  activated = false;
  chatHistory = [];
  document.getElementById('chatPanel').style.display = 'none';
  document.getElementById('chatPanel').classList.remove('visible', 'minimized');
  document.getElementById('chatContent').innerHTML = '';

  const splash = document.getElementById('splash');
  const page = document.getElementById('canvas-page');
  const grid = document.getElementById('gridCanvas');
  const circle = document.getElementById('jarvisCircle');
  const dashboard = document.getElementById('dashboard');

  splash.classList.remove('hiding');
  pCanvas.classList.remove('hidden');
  pActive = true;

  page.style.display = 'none';
  page.classList.remove('visible');
  circle.classList.remove('entered', 'thinking');
  grid.classList.remove('visible');
  dashboard.classList.remove('visible');

  document.getElementById('askInput').value = '';
  showToast('Reset to home');
}

document.getElementById('lockBtn').addEventListener('click', resetToSplash);

// Toast
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('visible'), 4200);
}

// Init
async function init() {
  await loadSettings();
  await loadLLMStatus();
  setInterval(loadLLMStatus, 30000);
}

init();
</script>
</body>
</html>
