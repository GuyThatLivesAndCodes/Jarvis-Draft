name: Release on Tag

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target:        x86_64-unknown-linux-gnu
            artifact_name: jarvis
            asset_name:    jarvis-linux-x86_64

          - os: macos-latest
            target:        x86_64-apple-darwin
            artifact_name: jarvis
            asset_name:    jarvis-macos-x86_64

          - os: macos-latest
            target:        aarch64-apple-darwin
            artifact_name: jarvis
            asset_name:    jarvis-macos-aarch64

          - os: windows-latest
            target:        x86_64-pc-windows-msvc
            artifact_name: jarvis.exe
            asset_name:    jarvis-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          chmod +x artifacts/${{ matrix.asset_name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.artifact_name }} artifacts\${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p final
          find release-artifacts -type f -exec cp {} final/ \;
          ls -lh final/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: final/*
          body: |
            ## Jarvis ${{ github.ref_name }}

            Pure-Rust fullscreen AI assistant — no web server, no runtime dependencies.

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `jarvis-linux-x86_64` |
            | macOS Intel  | `jarvis-macos-x86_64` |
            | macOS Apple Silicon | `jarvis-macos-aarch64` |
            | Windows x86_64 | `jarvis-windows-x86_64.exe` |

            ### Setup
            1. Download binary, make executable (`chmod +x` on Linux/macOS)
            2. Run — starts fullscreen immediately
            3. Click ⚙ in the bottom bar → add API keys
            4. **F11** toggles fullscreen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
